<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Verbatim Guard catches an invented number in an AI quotation">
<rect width="1200" height="480" rx="24" fill="#101820"/>
<g font-family="Arial, sans-serif">
<text x="48" y="57" fill="#75d5c0" font-size="14" letter-spacing="3">LOCAL EVIDENCE CHECKS · NO MODEL CALLS</text>
<text x="48" y="120" fill="#f1f6fa" font-size="48" font-weight="bold">A real source. A made-up quote.</text>
<text x="48" y="161" fill="#a5b9c8" font-size="22">Catch the mismatch before it reaches your reader.</text>
<rect x="48" y="200" width="530" height="145" rx="12" fill="#192a35"/>
<rect x="600" y="200" width="552" height="145" rx="12" fill="#192a35"/>
<text x="72" y="234" fill="#a5b9c8" font-size="15" letter-spacing="2">SOURCE · LINE 2</text>
<text x="624" y="234" fill="#a5b9c8" font-size="15" letter-spacing="2">AI QUOTATION</text>
<text x="72" y="281" fill="#e5edf3" font-size="24">The trial included <tspan fill="#75d5c0" font-weight="bold">48</tspan> participants.</text>
<text x="624" y="281" fill="#e5edf3" font-size="24">The trial included <tspan fill="#ffbe82" font-weight="bold">480</tspan> participants.</text>
<text x="72" y="318" fill="#75d5c0" font-size="15">EXACT</text>
<text x="624" y="318" fill="#ffbe82" font-size="15">NOT_FOUND</text>
<text x="48" y="405" fill="#e5edf3" font-size="23" font-weight="bold">Verbatim Guard</text>
<text x="48" y="437" fill="#a5b9c8" font-size="16">Python + CLI · Exact spans · Line checks · Source fingerprints</text>
<text x="1152" y="424" text-anchor="end" fill="#75d5c0" font-size="16">Text matching ≠ fact checking</text>
</g></svg>
